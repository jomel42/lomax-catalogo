apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lomax
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lomax-backend
  template:
    metadata:
      labels:
        app: lomax-backend
    spec:
      containers:
        - name: backend
          image: localhost:4566/000000000000/us-east-1/lomax-backend:entrega-fed44f0@sha256:1becee91d2366e8508e31ec958b7050b2c51849e3926ad24b273e617c62dbb23
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: backend-env
          env:
            - name: PORT
              value: "3000"
            - name: PGHOST
              value: "172.25.0.2"
            - name: PGPORT
              value: "7002"
            - name: FLOCI_ENDPOINT
              value: "http://172.25.0.2:4566"
          readinessProbe:
            httpGet:
              path: /categorias
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lomax
spec:
  selector:
    app: lomax-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
